---
title: Blog
permalink: /blog/
---
<h1>Seán's Blog</h1>
<ul>
  {% assign posts = site.blog | sort: "date" | reverse %}
  {% for post in posts %}
  <li class="highlighted">
    <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    <br><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y-%m-%d" }}</time>
  </li>
  {% endfor %}
</ul>
