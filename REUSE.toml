version = 1

[[annotations]]
path = [
  "src/_layouts/**",
  "src/_includes/**",
  "src/assets/css/**",
  "src/*.html",
  "_config.yml",
  ".gitignore",
  "Gemfile",
  "Gemfile.lock",
  "REUSE.toml",
  "README.md",
  "wrangler.jsonc",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Seán McGoff"
SPDX-License-Identifier = "AGPL-3.0-only"

[[annotations]]
path = [
  "src/_blog/**",
  "src/_projects/**",
  "src/_work/**",
  "src/_education/**",
  "src/_leadership/**",
  "src/pages/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Seán McGoff"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "src/assets/fonts/urgc/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2022 Vincent Morley / Gaelchló"
SPDX-License-Identifier = "LicenseRef-URCHLO-GC"

[[annotations]]
